api_url: http://localhost:13000                             # URL API Load Testing Hub

service:
  id: 1                                                       # ID сервиса
scenario:
  id: 5                                                     # ID сценария
  name: "new_user_get_accounts"                       # Название сценария
  file: "scenarios/grpc/gateway/new_user_get_accounts/v1.0.conf"                # Путь к конфигу сценария
  version: "v1.0"                                           # Версия
  number_of_users: 300                                      # Количество пользователей
  runtime_duration: "1m"                                    # Длительность теста

csv_locust_stats_file: "locust_grpc_gateway_new_user_get_accounts_stats.csv"                   # Итоговая статистика
json_locust_ratio_file: "locust_grpc_gateway_new_user_get_accounts_ratio.json"                 # Процентильное распределение
csv_locust_exceptions_file: "locust_grpc_gateway_new_user_get_accounts_exceptions.csv"         # Исключения
csv_locust_stats_history_file: "locust_grpc_gateway_new_user_get_accounts_stats_history.csv"   # Динамика по времени
