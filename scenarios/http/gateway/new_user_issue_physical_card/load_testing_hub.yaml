csv_locust_exceptions_file: "locust_http_gateway_new_user_issue_physical_card_exceptions.csv"         # Исключения
csv_locust_stats_history_file: "locust_http_gateway_new_user_issue_physical_card_stats_history.csv"   # Динамика по времени
